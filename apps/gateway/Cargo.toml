[package]
name = "openwrapper-gateway"
description = "Minimal HTTP boundary over openwrapper-core + provider adapters, and the SQLite-backed durable idempotency/payment store. See docs/ARCHITECTURE.md §4 for why this is the chosen deployment model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "openwrapper_gateway"
path = "src/lib.rs"

[[bin]]
name = "openwrapper-gateway"
path = "src/main.rs"

[dependencies]
openwrapper-core = { path = "../../crates/core" }
openwrapper-provider-paymob = { path = "../../crates/providers/paymob" }
openwrapper-provider-fawry = { path = "../../crates/providers/fawry" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
tower.workspace = true
tower-http.workspace = true
rusqlite.workspace = true
sqlx.workspace = true
redis.workspace = true
lapin.workspace = true
futures-util.workspace = true
secrecy.workspace = true
zeroize.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
sha2.workspace = true
hex.workspace = true
tonic.workspace = true
prost.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { workspace = true, features = ["util"] }

[[test]]
name = "http_integration"
path = "tests/http_integration.rs"

[[test]]
name = "stateless"
path = "tests/stateless.rs"
