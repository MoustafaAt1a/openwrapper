openapi: 3.1.0
info:
  title: OpenWrapper Gateway API
  version: 0.1.2
  description: |
    # OpenWrapper Payment Gateway API Specification (v0.1.2 LTS)

    OpenWrapper is a high-performance, minimalist payment aggregation gateway providing a single, unified contract for payment creation, status reconciliation, and webhook normalization across Egyptian and global payment providers (Paymob, Fawry, Stripe).

    ## Core Invariants & Semantics
    - **Boundary 1 Idempotency**: `POST /v1/payments` requires a client-supplied `Idempotency-Key` header. Identical requests return the original payment record without re-invoking upstream providers.
    - **Stateless Zero-Storage Routing**: Provider credentials can be passed dynamically per-request via HTTP headers or request body, enabling zero-database credential tenancy.
    - **Lossless Next-Actions**: Next-step actions preserve provider-specific mechanics (`redirect_to_url` vs `pay_at_reference`) without lossy unification.
    - **Deterministic Error Model**: Structured error responses containing machine-readable `code` and descriptive `message`.

servers:
  - url: https://web-production-884cd.up.railway.app
    description: Production Live Gateway (Railway)
  - url: http://127.0.0.1:3000
    description: Local Web Gateway Instance
  - url: http://127.0.0.1:8080
    description: Local Rust Core Gateway Instance

security:
  - ApiKeyAuth: []

paths:
  /v1/payments:
    post:
      tags:
        - Payments
      summary: Create Payment Intent
      description: |
        Initiates a payment across the specified provider (Paymob, Fawry, Stripe). Requires an `Idempotency-Key` header.
        Supports both server-configured credentials and per-request stateless headers (`X-Paymob-*`, `X-Fawry-*`, `X-Stripe-*`).
        If a request with the same idempotency key and payload is retransmitted, the existing payment record is returned with HTTP 200/201.
      operationId: createPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique ASCII key (1–200 bytes, printable ASCII without whitespace) identifying this logical payment attempt.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: "order-98234-attempt-1"
        - name: X-Paymob-Secret-Key
          in: header
          required: false
          description: Optional per-request Paymob Secret API Key.
          schema:
            type: string
        - name: X-Paymob-Public-Key
          in: header
          required: false
          description: Optional per-request Paymob Public API Key.
          schema:
            type: string
        - name: X-Paymob-Hmac-Secret
          in: header
          required: false
          description: Optional per-request Paymob HMAC validation secret.
          schema:
            type: string
        - name: X-Paymob-Integration-Id
          in: header
          required: false
          description: Optional per-request Paymob card/wallet integration ID.
          schema:
            type: string
        - name: X-Fawry-Merchant-Code
          in: header
          required: false
          description: Optional per-request Fawry Merchant Code.
          schema:
            type: string
            example: "1013970"
        - name: X-Fawry-Secure-Key
          in: header
          required: false
          description: Optional per-request Fawry Security Key / Shared Secret.
          schema:
            type: string
        - name: X-Fawry-Base-Url
          in: header
          required: false
          description: Optional custom Fawry API endpoint URL (for staging vs production).
          schema:
            type: string
            format: uri
        - name: X-Stripe-Secret-Key
          in: header
          required: false
          description: Optional per-request Stripe Secret API Key (sk_live_* / sk_test_*).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment initiated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentView'
        '200':
          description: Existing payment record returned (idempotent duplicate request or recorded ambiguous outcome).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentView'
        '400':
          description: Validation error or idempotency payload conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing required provider credentials (pass headers or configure backend env vars).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream provider rejected the request with definite non-occurrence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/{id}:
    get:
      tags:
        - Payments
      summary: Get Payment Status
      description: |
        Retrieves the current state of a payment. If the payment is currently in `unknown` state and the provider supports on-demand status inquiry, OpenWrapper automatically attempts active reconciliation against the provider before returning.
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          description: Unique OpenWrapper Payment ID (ULID string).
          schema:
            type: string
            example: "pay_01J6G7RPQZ4Z9M6W3V2T1K8N90"
      responses:
        '200':
          description: Current payment record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentView'
        '400':
          description: Invalid payment ID format or payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/webhooks/{provider}:
    post:
      tags:
        - Webhooks
      summary: Ingest Provider Webhook
      description: |
        Endpoint for upstream provider asynchronous payment notifications (callbacks / webhooks).
        Authenticates caller using provider cryptographic signature (HMAC-SHA512 for Paymob, SHA-256 concatenation for Fawry, Stripe-Signature for Stripe).
        Deduplicates incoming deliveries using database-backed delivery event IDs.
      operationId: ingestWebhook
      security: [] # Webhooks use provider-specific signatures, not gateway API keys
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider identifier (`paymob`, `fawry`, or `stripe`).
          schema:
            type: string
            enum: [paymob, fawry, stripe]
            example: "stripe"
        - name: stripe-signature
          in: header
          required: false
          description: Stripe webhook signature header.
          schema:
            type: string
        - name: x-paymob-hmac
          in: header
          required: false
          description: Paymob HMAC signature header.
          schema:
            type: string
      requestBody:
        required: true
        description: Raw provider notification payload (JSON or Form).
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Webhook verified, processed, and state transition applied or deduplicated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  eventId:
                    type: string
                    example: "evt_123456"
        '400':
          description: Malformed webhook payload, invalid signature, or amount mismatch.
        '401':
          description: Missing or invalid cryptographic webhook signature.
        '404':
          description: Unknown or unconfigured provider.

  /v1/health:
    get:
      tags:
        - System
      summary: Liveness Probe
      description: Returns liveness status of the gateway process.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  version:
                    type: string
                    example: "0.1.2"

  /v1/ready:
    get:
      tags:
        - System
      summary: Readiness Probe
      description: Returns readiness status of the gateway process, verifying store connectivity.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Gateway is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ready"
                  version:
                    type: string
                    example: "0.1.2"
                  store:
                    type: string
                    example: "ok"
        '503':
          description: Store connectivity failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "not_ready"
                  error:
                    type: string
                    example: "database connection timeout"

  /v1/version:
    get:
      tags:
        - System
      summary: Version Information
      description: Returns current OpenWrapper gateway release version.
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "0.1.2"
                  service:
                    type: string
                    example: "openwrapper-gateway"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API Key authentication via `Bearer <api_key>` or `X-API-Key: <api_key>`."

  schemas:
    CreatePaymentRequest:
      type: object
      required:
        - provider
        - amount_minor_units
        - currency
        - customer
      properties:
        provider:
          type: string
          description: Integrated payment provider identifier.
          example: "fawry"
          enum: [paymob, fawry, stripe]
        amount_minor_units:
          type: integer
          format: int64
          description: Payment amount in integer minor currency units (e.g. 1000 = 10.00 EGP).
          minimum: 1
          example: 15000
        currency:
          type: string
          description: Closed 3-letter ISO-4217 currency code.
          example: "EGP"
          enum: [EGP, USD, EUR, GBP, SAR, AED]
        customer:
          $ref: '#/components/schemas/CustomerDetails'
        merchant_reference:
          type: string
          nullable: true
          description: Optional merchant internal order/transaction reference.
          example: "order-2026-08-31-001"
        description:
          type: string
          nullable: true
          description: Optional payment description for line items or statement descriptor.
          example: "Annual Pro Plan Subscription"
        return_url:
          type: string
          format: uri
          nullable: true
          description: Customer redirect return URL after checkout completion.
          example: "https://merchant.example/checkout/complete"
        provider_credentials:
          type: object
          description: Optional stateless per-request credentials if not using HTTP headers.
          properties:
            merchant_code:
              type: string
            secure_key:
              type: string
            secret_key:
              type: string
            public_key:
              type: string
            hmac_secret:
              type: string
            integration_id:
              type: string
            stripe_secret_key:
              type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Custom key-value metadata pairs.
          example:
            tier: "pro"
            user_id: "usr_9981"

    CustomerDetails:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          description: Customer mobile phone number (E.164 format strongly recommended).
          example: "+201000000000"
        email:
          type: string
          format: email
          nullable: true
          description: Customer email address.
          example: "customer@example.com"
        full_name:
          type: string
          nullable: true
          description: Customer full display name.
          example: "Ahmed Hassan"

    PaymentStatus:
      type: string
      description: |
        Authoritative payment status in the finite state machine:
        - `pending`: Payment created and awaiting customer action or async settlement.
        - `succeeded`: Terminal success; funds captured.
        - `failed`: Terminal failure; funds not captured.
        - `unknown`: Outcome ambiguous due to upstream provider timeout or network failure.
      enum:
        - pending
        - succeeded
        - failed
        - unknown
      example: "pending"

    PaymentNextAction:
      type: object
      discriminator:
        propertyName: type
      required:
        - type
      oneOf:
        - $ref: '#/components/schemas/RedirectToUrlAction'
        - $ref: '#/components/schemas/PayAtReferenceAction'

    RedirectToUrlAction:
      type: object
      required:
        - type
        - url
      properties:
        type:
          type: string
          enum: [redirect_to_url]
          example: "redirect_to_url"
        url:
          type: string
          format: uri
          description: Provider-hosted checkout URL to redirect the customer to.
          example: "https://accept.paymob.com/unifiedcheckout/?publicKey=pk_test_123&clientSecret=cs_456"

    PayAtReferenceAction:
      type: object
      required:
        - type
        - reference
      properties:
        type:
          type: string
          enum: [pay_at_reference]
          example: "pay_at_reference"
        reference:
          type: string
          description: Reference code for customer payment at kiosk, ATM, or retail outlet.
          example: "982348123"
        instructions:
          type: string
          nullable: true
          description: Optional provider instructions or expiry timeline.
          example: "Pay before 2026-08-31 18:00 at any Fawry retail point."

    PaymentView:
      type: object
      required:
        - payment_id
        - provider
        - status
        - amount_minor_units
        - currency
      properties:
        payment_id:
          type: string
          description: Unique OpenWrapper Payment ID.
          example: "pay_3fc5537c30b54f0ab873a29b"
        provider:
          type: string
          description: Payment provider adapter handling this payment.
          example: "fawry"
        provider_reference:
          type: string
          nullable: true
          description: Provider-assigned transaction id or correlation reference.
          example: "982348123"
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount_minor_units:
          type: integer
          format: int64
          description: Amount in integer minor units.
          example: 15000
        currency:
          type: string
          description: ISO-4217 3-letter currency code.
          example: "EGP"
        merchant_reference:
          type: string
          nullable: true
          description: Merchant reference passed at creation.
          example: "order-2026-08-31-001"
        next_action:
          $ref: '#/components/schemas/PaymentNextAction'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: "missing_provider_credentials"
          enum:
            - invalid_request
            - missing_provider_credentials
            - idempotency_conflict
            - unauthorized
            - validation_error
            - authentication_error
            - authorization_error
            - configuration_error
            - network_error
            - timeout_error
            - provider_error
            - rate_limit_error
            - unsupported_capability
            - security_error
            - unknown_outcome
            - internal_error
        message:
          type: string
          description: Human-readable, deterministic explanation of the error.
          example: "Fawry credentials missing. Provide X-Fawry-Merchant-Code and X-Fawry-Secure-Key headers."
