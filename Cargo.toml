[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers/paymob",
    "crates/providers/fawry",
    "apps/gateway",
    "tests/architecture",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MoustafaAt1a/openwrapper"
publish = false

# Centralized, pinned, justified dependency versions. See docs/DEPENDENCIES.md
# for the rationale behind every entry in this table.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
# Postgres backend for the gateway store (multi-replica deployments —
# see docs/DECISIONS.md). Runtime-checked queries only (no `query!`
# macros), deliberately: this project's build must not require a live
# database connection just to compile. `rustls`, not the default
# native-tls, for consistency with D7's TLS backend decision.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "time"] }
# Client for an optional Valkey/Dragonfly-backed distributed rate limiter
# (see apps/gateway/src/rate_limit.rs). Both speak the same RESP protocol this
# crate implements — there is no dedicated "Valkey client" or "Dragonfly
# client" crate needed, nor is this a dependency on Redis itself (a
# protocol implementation, not the Redis server or its license).
redis = { version = "0.25", default-features = false, features = ["tokio-comp"] }
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
secrecy = { version = "0.8", features = ["serde"] }
# `zeroize`/`time` and the `url`/`idna` family now require edition 2024
# (supported since rustc 1.85). With MSRV 1.88 those pins are no longer
# needed for correctness; versions are left as caret requirements so the
# resolver can follow security updates without manual bumps.
zeroize = "1.7"
url = "2.5"
idna = "0.5"
indexmap = "2.2"
base64ct = "1.6"
home = "0.5"
crc = "3.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit", "timeout"] }
# Optional async message bus for webhook processing and reconciliation (see apps/gateway/src/amqp.rs).
# lapin 4.10.0 is the current stable line (MSRV 1.88). Features use
# ring (no cmake/NASM requirement) + tokio runtime to stay compatible with
# the gateway's async runtime. Previously pinned to =2.3.0 for rustc 1.75.
lapin = { version = "4.10.0", default-features = false, features = ["rustls", "rustls--ring", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
