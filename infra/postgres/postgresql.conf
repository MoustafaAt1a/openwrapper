# ==============================================================================
# OpenWrapper PostgreSQL 17 Production Configuration
# Tuned specifically for Oracle Cloud Always Free Ampere A1 (4 ARM64 OCPUs, 24 GB RAM)
# ==============================================================================

# Connectivity
listen_addresses = '*'
port = 5432
max_connections = 150
superuser_reserved_connections = 3

# Memory Allocation (Host: 24 GB RAM)
shared_buffers = 4GB                  # 16-25% of total RAM for shared buffers
effective_cache_size = 12GB           # Estimate of memory available for OS page cache + Postgres
maintenance_work_mem = 1GB            # Memory for VACUUM, CREATE INDEX, ALTER TABLE
work_mem = 32MB                       # Memory per query operation (sort, hash table)
dynamic_shared_memory_type = posix

# Write-Ahead Log (WAL) & Checkpoints
wal_level = replica
wal_buffers = 64MB                    # Auto-tuned up to 64MB for write-intensive payment ledgers
checkpoint_completion_target = 0.9    # Spread checkpoint I/O over 90% of checkpoint interval
checkpoint_timeout = 15min            # Reduce checkpoint frequency on NVMe block storage
max_wal_size = 8GB                    # Allow burst write transactions during reconciliation
min_wal_size = 1GB
archive_mode = off                    # Enable if streaming WAL to Cloudflare R2 / S3
synchronous_commit = off              # Ultra-high write throughput for idempotent ledger updates

# Query Planner & NVMe Storage Cost Constants
random_page_cost = 1.1                # Fast NVMe block volume random read penalty (SSD baseline)
seq_page_cost = 1.0                   # Sequential page cost baseline
effective_io_concurrency = 200        # NVMe concurrent request queue depth
default_statistics_target = 100       # Accurate planner statistics for indexed queries

# Parallel Query Execution (4 ARM64 Cores)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging & Observability
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250      # Log slow queries taking > 250ms
log_line_prefix = '%m [%p] %q%u@%d '  # Timestamp, PID, user, database
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0                    # Log all temporary spill files (indicates work_mem needs tuning)

# Autovacuum Resource Limits
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05 # Aggressive vacuuming on high-churn payment state transitions
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# Client Connection Defaults
timezone = 'UTC'
client_encoding = 'UTF8'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
