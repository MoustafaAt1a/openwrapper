[pgbouncer]

; ── Connection Settings ──────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Pool Mode ────────────────────────────────────────────────────
; transaction: releases connection back to pool after each transaction
; This is optimal for web apps with short-lived queries.
pool_mode = transaction

; ── Pool Sizing ──────────────────────────────────────────────────
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 200
max_db_connections = 50

; ── Timeouts ─────────────────────────────────────────────────────
server_idle_timeout = 30
server_lifetime = 3600
server_connect_timeout = 5
client_idle_timeout = 120
query_timeout = 30
query_wait_timeout = 60

; ── Logging ──────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0

; ── TLS ───────────────────────────────────────────────────────────
; These connections stay on the deployment's private container network.
; Enable TLS here when the database or clients cross a trust boundary.
server_tls_sslmode = disable
client_tls_sslmode = disable

; ── Databases ────────────────────────────────────────────────────
[databases]
* = host=${PGHOST} port=${PGPORT} dbname=${PGDATABASE}
