[pgbouncer]

; ── Connection Settings ──────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Admin & Monitoring Access ────────────────────────────────────
; Grants permissions to query internal pseudo-database for telemetry
admin_users = openwrapper
stats_users = openwrapper

; ── Startup Parameter Handling ───────────────────────────────────
; Prevents clients (rust sqlx, drizzle, prisma, better-auth) from failing on connect
ignore_startup_parameters = extra_float_digits,search_path,application_name,timezone

; ── Pool Mode ────────────────────────────────────────────────────
; transaction: releases connection back to pool after each transaction
; Optimal for stateless web and API microservices.
pool_mode = transaction

; ── Pool Sizing ──────────────────────────────────────────────────
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 200
max_db_connections = 50

; ── Timeouts ─────────────────────────────────────────────────────
server_idle_timeout = 30
server_lifetime = 3600
server_connect_timeout = 5
client_idle_timeout = 120
; query_timeout = 0 disables killing long transactions (essential for database migrations)
query_timeout = 0
query_wait_timeout = 60

; ── Logging ──────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0

; ── TLS ───────────────────────────────────────────────────────────
; Kept disabled within the private Docker bridge network for maximum performance
server_tls_sslmode = disable
client_tls_sslmode = disable

; ── Databases ────────────────────────────────────────────────────
[databases]
* = host=${PGHOST} port=${PGPORT} dbname=${PGDATABASE}
