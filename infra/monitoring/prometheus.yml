# ==============================================================================
# OpenWrapper Prometheus Configuration
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. OpenWrapper Gateway Replicas (Prometheus metrics)
  - job_name: "openwrapper-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway-1:8080"
          - "gateway-2:8080"
        labels:
          tier: "payment-engine"
          platform: "oracle-ampere-a1"

  # 2. Host System Metrics (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "oracle-vps-4core-24gb"

  # 3. Docker Container Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "production"

  # 4. Internal Reverse Proxy & Router (Caddy)
  - job_name: "caddy"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["caddy:2019"]
