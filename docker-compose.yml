
# A complete local/real-world stack: the gateway, Postgres (multi-replica-
# capable store — see docs/DECISIONS.md), PgBouncer (transaction-mode pooler),
# RabbitMQ (optional async webhook/reconciliation bus), and Valkey (distributed
# rate limiter cache — optional, only used for that one purpose, see
# gateway/src/rate_limit.rs). Dragonfly is a drop-in alternative to the
# valkey service below (see the commented block) — both speak the same
# RESP protocol this project's rate limiter client uses.
#
# Quickstart:
#   cp .env.example .env   # fill in real values
#   docker compose up --build
#
# This intentionally does NOT terminate TLS — see docs/DEPLOYMENT.md for
# putting a reverse proxy in front of this for real internet exposure.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwrapper
      POSTGRES_USER: openwrapper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwrapper"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432" # loopback only — do not expose Postgres publicly

  pgbouncer:
    build:
      context: ./infra/pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: openwrapper
      PGUSER: openwrapper
      PGPASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U openwrapper -d openwrapper"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6432:6432" # loopback only — do not expose publicly

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openwrapper}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set a real password in .env}
      RABBITMQ_DEFAULT_VHOST: openwrapper
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5672:5672" # loopback only — do not expose publicly
      - "127.0.0.1:15672:15672" # management UI — loopback only

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # --- Dragonfly alternative (comment out `valkey` above, uncomment below) ---
    # image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    # ulimits:
    #   memlock: -1
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379" # loopback only — do not expose publicly

  gateway:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      OPENWRAPPER_BIND_ADDR: "0.0.0.0:8080"
      OPENWRAPPER_DATABASE_URL: "postgres://openwrapper:${POSTGRES_PASSWORD:?}@pgbouncer:6432/openwrapper"
      OPENWRAPPER_CACHE_URL: "redis://valkey:6379"
      OPENWRAPPER_AMQP_URL: "amqp://${RABBITMQ_USER:-openwrapper}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/openwrapper"
      OPENWRAPPER_API_KEYS: ${OPENWRAPPER_API_KEYS:?set at least one API key in .env}
      OPENWRAPPER_LOG_FORMAT: json
      OPENWRAPPER_ENABLE_PAYMOB: ${OPENWRAPPER_ENABLE_PAYMOB:-false}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      PAYMOB_NOTIFICATION_URL: ${PAYMOB_NOTIFICATION_URL:-}
      OPENWRAPPER_ENABLE_FAWRY: ${OPENWRAPPER_ENABLE_FAWRY:-false}
      FAWRY_MERCHANT_CODE: ${FAWRY_MERCHANT_CODE:-}
      FAWRY_SECURE_KEY: ${FAWRY_SECURE_KEY:-}
      FAWRY_BASE_URL: ${FAWRY_BASE_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      pgbouncer:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://openwrapper:${POSTGRES_PASSWORD:?}@pgbouncer:6432/openwrapper"
      DATABASE_POOLER_URL: "postgres://openwrapper:${POSTGRES_PASSWORD:?}@pgbouncer:6432/openwrapper"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OPENWRAPPER_GATEWAY_URL: "http://gateway:8080"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
