name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace --jobs 2

      - name: Architecture Invariants
        run: cargo test -p openwrapper-test-architecture

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Run TypeScript Tests
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Run PHP Tests
        run: php sdk/php/tests/run.php

  dotnet:
    name: .NET SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET Tests
        run: dotnet test sdk/dotnet/OpenWrapper.sln

  web:
    name: Next.js Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build Application
        working-directory: web
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/openwrapper
          BETTER_AUTH_SECRET: test_ci_secret_32_characters_long_key_openwrapper

  openapi:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Lint OpenAPI Specification
        run: npx --yes @redocly/cli@2.49.0 lint openapi.yaml

      - name: Verify Published YAML Is Current
        run: cmp --silent openapi.yaml docs/openapi/openapi.yaml

  operations:
    name: Operational Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Shell Scripts
        run: shellcheck scripts/*.sh infra/scripts/*.sh infra/pgbouncer/*.sh

      - name: Parse Kubernetes Manifests
        run: ruby -e "require 'yaml'; YAML.load_stream(File.read('infra/k8s/deployment.yaml')); puts 'Kubernetes YAML parsed'"

      - name: Validate Compose Files
        env:
          POSTGRES_PASSWORD: ci_postgres_password
          RABBITMQ_PASSWORD: ci_rabbitmq_password
          OPENWRAPPER_API_KEYS: ci_openwrapper_api_key
          BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars
          DOMAIN: openwrapper.example.com
          ACME_EMAIL: ops@example.com
          BETTER_AUTH_URL: https://openwrapper.example.com
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Caddy Configuration
        run: >-
          docker run --rm
          -e DOMAIN=openwrapper.example.com
          -e ACME_EMAIL=ops@example.com
          -v "${{ github.workspace }}/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Check Gateway Dockerfile
        run: docker build --check .

  live-api:
    name: Live API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.RUN_LIVE_API_TESTS == '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install k6
        run: |
          curl --fail --silent --show-error --location https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor --output /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends k6

      - name: Run live API security + stress tests
        env:
          TARGET_URL: ${{ secrets.LIVE_API_TARGET_URL }}
          API_KEY: ${{ secrets.LIVE_API_KEY }}
          REQUIRE_LIVE_API_SECRETS: "1"
        run: bash scripts/test-live-api.sh
